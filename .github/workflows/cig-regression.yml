name: Deployed-v2 defensive regression

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cig-defensive-regression

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx hardhat test test/cig-auction-regression.js
