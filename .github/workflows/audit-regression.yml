name: Defensive regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - audit/bribes-defensive-regression

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npx hardhat test test/bribes-regression.js
